  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPRIET Academic Portal</title>
    <style>
        /* Force a total layout reset */
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* BULLETPROOF CENTERING TECHNIQUE:
           Uses fixed viewport locking to ensure the container is centered,
           regardless of how the browser treats body margins.
        */
        .screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #f4f7fc 0%, #e2eaf4 100%);
            display: grid;
            place-items: center; /* Locks item dead center horizontally and vertically */
            padding: 20px !important;
        }

        /* The Main Portal Card Box */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px !important;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
            text-align: center;
        }

        .logo-box {
            margin-bottom: 24px !important;
            display: flex;
            justify-content: center;
        }

        .college-logo {
            width: 190px;
            height: auto;
        }

        h2 {
            color: #0b2545; /* Deep corporate blue from KPR branding */
            font-size: 1.45rem;
            margin-bottom: 6px !important;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 30px !important;
        }

        /* Form styling */
        .input-group {
            text-align: left;
            margin-bottom: 20px !important;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px !important;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px !important;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Green accent glow on focus matching the leaf icon */
        input:focus {
            border-color: #2ea44f; 
            box-shadow: 0 0 0 3px rgba(46, 164, 79, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 28px !important;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #475569;
        }

        .remember-me input {
            margin-right: 6px !important;
        }

        .forgot-link {
            color: #0b2545;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px !important;
            background-color: #0b2545;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background-color: #133966;
        }
    </style>
</head>
