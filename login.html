<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPRIET - Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="logo-box">
            <img src="download.jpg" alt="KPR Institute of Engineering and Technology Logo" class="college-logo">
        </div>

        <div class="form-header">
            <h2>Academic Portal</h2>
            <p>Sign in to access your dashboard</p>
        </div>

        <form class="login-form">
            <div class="input-control">
                <label for="username">Roll Number / Email Address</label>
                <input type="text" id="username" placeholder="Enter your ID or Email" required autocomplete="username">
            </div>

            <div class="input-control">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="remember-checkbox">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>

        <div class="card-footer">
            <p>Need help? Contact <a href="#">IT Support</a></p>
        </div>
    </div>

</body>
</html>
