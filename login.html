<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPRIET Portal Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Forces absolute centering onto the middle of the screen */
        body {
            display: flex;           
            justify-content: center; 
            align-items: center;     
            min-height: 100vh;       
            background: linear-gradient(135deg, #f4f7fc 0%, #e2eaf4 100%);
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
            text-align: center;
        }

        .logo-box {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .college-logo {
            max-width: 220px;
            height: auto;
        }

        h2 {
            color: #0b2545; 
            font-size: 1.4rem;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #2ea44f; 
            box-shadow: 0 0 0 3px rgba(46, 164, 79, 0.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            cursor: pointer;
        }

        .forgot-link {
            color: #0b2545;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background-color: #0b2545;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background-color: #133966;
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="logo-box">
            <img src="https://kpriet.ac.in/asset/images/logo.png" alt="KPR Institute of Engineering and Technology Logo" class="college-logo">
        </div>

        <h2>Academic Portal</h2>
        <p class="subtitle">Sign in to access your dashboard</p>

        <form onsubmit="event.preventDefault(); alert('Form submitted!');">
            <div class="input-group">
                <label for="username">Roll Number / Email Address</label>
                <input type="text" id="username" placeholder="Enter your ID or Email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

    </div>

</body>
</html>
